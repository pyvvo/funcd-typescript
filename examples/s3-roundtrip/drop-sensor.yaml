# gold-ingest starts an ingest run for each object that gold-drops reports, with its key as input file.
apiVersion: funcd.io/v1alpha1
kind: Sensor
metadata:
  name: gold-ingest
  namespace: default
  resourceGroup: rg1
spec:
  on:
    - name: dropped
      source: gold-drops
      event: arrived
  do:
    - name: run
      on: dropped
      workflow: ingest
      input:
        file: "${{ event.data.key }}"
