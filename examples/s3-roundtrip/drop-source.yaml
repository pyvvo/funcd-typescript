# gold-drops fires arrived for each new or rewritten object under gold/ of the Bucket lakehouse.
apiVersion: funcd.io/v1alpha1
kind: EventSource
metadata:
  name: gold-drops
  namespace: default
  resourceGroup: rg1
spec:
  blob:
    bucket: lakehouse       # the Bucket of bucket.yaml
    events:
      - name: arrived       # the CloudEvent `type`
        prefix: gold/       # only objects under gold/, the prefix s3-roundtrip owns, fire
        on:
          - Created
