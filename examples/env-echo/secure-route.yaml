# secure-echo: a Route that serves env-echo at /secure and asks its callers to authenticate. A request needs a
# bearer token or an X-Api-Key header of an identity that may get Functions in the namespace: 401 without a valid
# one, 403 when that identity may not. While server.auth.edge is off, every caller gets 401. The mode covers the
# rules of this Route only.
apiVersion: funcd.io/v1alpha1
kind: Route
metadata:
  name: secure-echo
  namespace: default
  resourceGroup: rg1
spec:
  auth:
    mode: authenticated
  rules:
    - path: /secure
      backend:
        function: env-echo
