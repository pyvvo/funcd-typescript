# The client config of the search function (funcd ADR-0122); `funcdctl dev .` runs it with search-db (funcd ADR-0237).
runtime: nodejs22
handler: handle
bindings:
  sql:
    - alias: app
      database: search-db
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
        enum:
          - init
          - add
          - search
          - tags
          - remove
      title:
        type: string
      body:
        type: string
      tags:
        type: array
        items:
          type: string
      q:
        type: string
      tag:
        type: string
      id:
        type: integer
      limit:
        type: integer
        minimum: 1
        maximum: 100
    required:
      - op
  output:
    type: object
    additionalProperties: false
    properties:
      id:
        type: integer
      hits:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
            title:
              type: string
            snippet:
              type: string
            tags:
              type: array
              items:
                type: string
          required:
            - id
            - title
            - snippet
            - tags
      tags:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            tag:
              type: string
            articles:
              type: integer
          required:
            - tag
            - articles
      changed:
        type: integer
