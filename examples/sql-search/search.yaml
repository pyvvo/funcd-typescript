# Function search: it declares search-db by name, so funcd creates it with search as its owner, and binds it as
# the alias app.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: search
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:search
  sql:
    - name: search-db
  bindings:
    sql:
      - alias: app
        database: search-db
