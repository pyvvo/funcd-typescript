# nightly-timer: a timer EventSource whose event tick fires every 5 seconds; the Sensor nightly of
# schedule-sensor.yaml starts a run of orders at each tick. An interval is a duration, such as 5s or 1h30m.
apiVersion: funcd.io/v1alpha1
kind: EventSource
metadata:
  name: nightly-timer
  namespace: default
  resourceGroup: rg1
spec:
  timer:
    events:
      - name: tick
        interval: 5s
