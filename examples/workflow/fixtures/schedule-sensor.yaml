# nightly: a Sensor that starts a run of the Workflow orders at each tick of the EventSource nightly-timer, with
# the input {"amount": 4}: the score is 40, above 30, so the run takes the hi branch and succeeds. Each run it
# starts is named nightly-start-<suffix>.
apiVersion: funcd.io/v1alpha1
kind: Sensor
metadata:
  name: nightly
  namespace: default
  resourceGroup: rg1
spec:
  on:
    - name: tick
      source: nightly-timer
      event: tick
  do:
    - name: start
      on: tick
      workflow: orders
      input:
        amount: 4
