# The client config of the notes function (funcd ADR-0122): `funcdctl push notes.mjs <ref>` bakes this contract in,
# and `funcdctl dev .` runs it from source with notes-db (funcd ADR-0237).
runtime: nodejs22
handler: handle
bindings:
  sql:
    - alias: app
      database: notes-db
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      op:
        type: string
        enum:
          - add
          - list
          - done
          - remove
          - move
      notebook:
        type: string
      title:
        type: string
      priority:
        type: integer
      id:
        type: integer
      to:
        type: string
    required:
      - op
  output:
    type: object
    additionalProperties: false
    properties:
      note:
        type: object
        additionalProperties: false
        properties:
          id:
            type: integer
          title:
            type: string
        required:
          - id
          - title
      notes:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
            notebook:
              type: string
            title:
              type: string
            done:
              type: boolean
            priority:
              type: integer
          required:
            - id
            - notebook
            - title
            - done
            - priority
      changed:
        type: integer
