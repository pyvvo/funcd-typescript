# SQLDatabase notes-db (funcd ADR-0232): one rqlite engine with a durable directory, written only by its owner, the
# notes function, and by the RolesAssignment of grant.yaml.
apiVersion: funcd.io/v1alpha1
kind: SQLDatabase
metadata:
  name: notes-db
  namespace: default
  resourceGroup: rg1
spec:
  owner: notes
