# Function notes, the owner of notes-db: spec.bindings.sql binds it as the alias app.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: notes
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:notes
  sql:
    - ref: notes-db
  bindings:
    sql:
      - alias: app
        database: notes-db
