# kv-counter — increments a per-name counter via the KV binding "counters" (context.kv, ADR-0069).
# The function owns its KVStore: the root `kv` entry creates counters-kv with the table-counters table,
# whose owner defaults to the function (funcd ADR-0248), so it may write it. The spec.bindings.kv entry
# (ADR-0073) IS the read capability: it maps the alias "counters" to that table. Default-deny — without
# it, context.kv on "counters" is Forbidden.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: counter
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:counter   # funcdctl push counter.mjs (built from src/main.ts)
  replicas: 1
  scaling:
    minReplicas: 1
  kv:
    - name: counters-kv         # the KVStore (domain) this function owns
      tables:
        - name: table-counters  # the sub-domain counter owns (single writer)
  bindings:
    kv:
      - alias: counters         # the in-code handle: ctx.kv.*('counters', …)
        store: counters-kv
        table: table-counters
