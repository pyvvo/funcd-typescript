# demo-token: a Secret whose key TOKEN starts with a dummy value. Its owner, token-owner, writes TOKEN. token-user
# binds the Secret too, and writes it only once fixtures/grant.yaml gives it the role Secret Data Writer.
# region secret
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: demo-token
  namespace: default
  resourceGroup: rg1
spec:
  owner: token-owner
  data:
    TOKEN: dG9rZW4tdjE=   # base64("token-v1")
# endregion secret
