# Daemon config for the http-api example on real containerd (funcd ADR-0243). Used by funcd's `http-api` lane
# (scripts/lanes.yaml, `just lima-example http-api`): file storage, the containerd runtime and the dev token.
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
log:
  format: text
  level: info
