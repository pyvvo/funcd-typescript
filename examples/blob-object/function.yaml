# blob-object — reads+writes objects NATIVELY via context.blob (ADR-0127). The function owns its Bucket:
# the root `buckets` entry creates lakehouse with the gold prefix, whose owner defaults to the function
# (funcd ADR-0248), so it may write it (single writer). The spec.bindings.blob entry (ADR-0073) IS the read
# capability: it maps the alias "gold" to that prefix. Default-deny — the function does NOT bind "other",
# so a put there is denied. No S3 keypair injected for the native path.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: blob-object
  namespace: default
  resourceGroup: rg1
spec:
  runtime: nodejs22
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:blob-object   # funcdctl push blob-object.mjs (built from src/main.ts)
  replicas: 1
  scaling:
    minReplicas: 1
  buckets:
    - name: lakehouse            # the Bucket (domain) this function owns
      prefixes:
        - name: gold             # serving layer — written by blob-object (its owner → single writer)
      maxObjectBytes: 1073741824   # per-object cap (1 GiB)
  bindings:
    blob:
      - alias: gold           # the in-code handle: ctx.blob.*('gold', …)
        bucket: lakehouse
        prefix: gold
