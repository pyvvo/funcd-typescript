runtime: nodejs22
input:
  type: object
  additionalProperties: false
  properties:
    url:
      type: string
  required:
    - url
output:
  type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
    status:
      type: number
    error:
      type: string
  required:
    - ok
    - status
    - error
