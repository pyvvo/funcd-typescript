# allow-one-one-one-one: an EgressPolicy for every Function of the namespace default that allows connections on
# port 443 to the address 1.1.1.1. A connection to an address needs no lookup, so a CIDR rule allows it by the
# address alone; an address that no rule holds, such as 1.0.0.1, stays refused. Both EgressPolicies of this folder
# apply together: a connection that either allows goes through.
apiVersion: funcd.io/v1alpha1
kind: EgressPolicy
metadata:
  name: allow-one-one-one-one
  namespace: default
  resourceGroup: rg1
spec:
  rules:
    - to:
        cidrs:
          - 1.1.1.1/32
      ports:
        - 443
