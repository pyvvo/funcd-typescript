# allow-example-subdomains: an EgressPolicy for every Function of the namespace default, since it sets no
# appliesTo. It allows connections on port 443 to every name under example.com.
apiVersion: funcd.io/v1alpha1
kind: EgressPolicy
metadata:
  name: allow-example-subdomains
  namespace: default
  resourceGroup: rg1
spec:
  rules:
    - to:
        domains:
          - "*.example.com"
      ports:
        - 443
